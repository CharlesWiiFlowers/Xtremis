name: astro-platform

# Todas las variables tienen valor por defecto: funciona sin .env.
# Para cambiarlas (contraseñas, puertos, dominio) copia .env.example a .env y edítalo.
x-mysql-env: &mysql-env
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: ${MYSQL_USER:-astro}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-astro_change_me}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-astro}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-astro}
      MYSQL_USER: ${MYSQL_USER:-astro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-astro_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      # Solo se ejecuta la primera vez (volumen vacío)
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Solo accesible desde la propia máquina, nunca desde internet
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  python:
    build:
      context: .
      dockerfile: python/Dockerfile
    restart: unless-stopped
    environment:
      <<: *mysql-env
      MAST_GAIA_TABLE: ${MAST_GAIA_TABLE:-}
      WISE_TABLE: ${WISE_TABLE:-allwise_p3as_psd}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      CATALOG_PATH: /catalog/api_catalog.json
    volumes:
      - ./catalog:/catalog:ro
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  node:
    build:
      context: .
      dockerfile: node/Dockerfile
    restart: unless-stopped
    depends_on:
      python:
        condition: service_healthy
    environment:
      <<: *mysql-env
      PORT: "3010"
      PYTHON_SERVICE_URL: http://python:8001
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-40000}
    ports:
      # Local: 0.0.0.0:3010. Detrás de Caddy (web) usa APP_BIND=127.0.0.1
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3010}:3010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # HTTPS automático para la web. Solo se levanta con:  docker compose --profile web up -d --build
  caddy:
    image: caddy:2
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
