server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite cargar rutas del frontend aunque el usuario recargue la página.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados tienen hash en el nombre y se pueden cachear.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
