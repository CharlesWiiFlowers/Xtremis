# Puerta única de CygnusX: sirve el visor y reparte el resto hacia los servicios internos.
#   /            visor SPHEREx (React, estático)
#   /orbital/    simulador ORBITAL            -> orbital:3010
#   /api/v1/*    API ORBITAL (MySQL, Gaia...) -> orbital:3010
#   /api/*       API SPHEREx (FastAPI)        -> backend:8000
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker; resolver por petición evita que nginx caiga si un servicio aún no arrancó.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $orbital_upstream http://orbital:3010;
    set $spherex_upstream http://backend:8000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    location = /orbital { return 301 /orbital/; }
    location /orbital/ { proxy_pass $orbital_upstream; }

    location /api/v1/ {
        proxy_pass $orbital_upstream;
        proxy_read_timeout 60s;
    }

    # Un espectro o recorte nuevo puede tardar 1-3 min en bajar de IRSA.
    location /api/ {
        proxy_pass $spherex_upstream;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ~ ^/(docs|redoc|openapi\.json)$ { proxy_pass $spherex_upstream; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
